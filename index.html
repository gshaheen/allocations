<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allocations</title>
  <meta name="description" content="Construct a portfolio of allocations and visualize across every breakdown chart type.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Top Header: ONLY visible on the 100% tiled screen -->
  <header class="top-header" id="topHeader" style="display: none;">
    <a href="#" id="btnBrandLogo" class="brand-title">allocations</a>

    <div class="header-icons">
      <button type="button" id="btnShareIcon" class="icon-btn" title="Copy shareable link" aria-label="Share">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <button type="button" id="btnResetIcon" class="icon-btn" title="Reset allocations" aria-label="Reset">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Stage 1: Blank Screen Input Choreography -->
  <main class="input-stage" id="inputStage">
    <!-- Previously completed [Category][% ] pairs docked cleanly -->
    <div class="completed-pairs-bar" id="completedPairsBar"></div>

    <!-- Active Choreography Row -->
    <div class="active-choreography-row" id="choreographyRow">
      <!-- Category Box Wrapper (drawn clockwise on Enter, then slides left) -->
      <div class="box-entity category-entity" id="categoryEntity" style="display: none;">
        <span class="entity-text" id="categoryEntityText"></span>
        <svg class="box-svg" id="categoryBoxSvg" preserveAspectRatio="none">
          <path class="box-path" id="categoryBoxPath" d=""></path>
        </svg>
      </div>

      <!-- Percent Box Wrapper (appears after slide left, squares up on Enter, joins category) -->
      <div class="box-entity percent-entity" id="percentEntity" style="display: none;">
        <span class="entity-text" id="percentEntityText"></span>
        <svg class="box-svg" id="percentBoxSvg" preserveAspectRatio="none">
          <path class="box-path" id="percentBoxPath" d=""></path>
        </svg>
      </div>

      <!-- Live Typing Line (Blinking Cursor) -->
      <div class="typing-line" id="typingLine">
        <span class="typed-content" id="typedContent"></span><span class="prompt-placeholder" id="promptPlaceholder"></span><span class="blinking-cursor" id="blinkingCursor" aria-hidden="true">&#9608;</span>
      </div>
    </div>

    <!-- Invisible input capturing keystrokes -->
    <input
      type="text"
      id="hiddenInput"
      class="hidden-input"
      autocomplete="off"
      autofocus
      spellcheck="false"
      aria-label="Allocation input"
    >
  </main>

  <!-- Stage 2: Tiled Multi-Chart Screen (Fits 100% of screen with zero scrolling & zero remaining whitespace) -->
  <section class="tiles-stage" id="tilesStage" style="display: none;" aria-label="Allocation Breakdown Charts">
    <div class="tiles-grid" id="tilesGrid"></div>
  </section>

  <!-- Minimal Toast -->
  <div id="toast" class="toast" aria-live="polite">Link copied</div>

  <script src="js/app.js"></script>
</body>
</html>
